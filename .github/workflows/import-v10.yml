name: Import pasted 1000 V10

on:
  push:
    branches: [english-100-prototype]
    paths:
      - 'english-100/v10-source.tsv'
      - '.github/workflows/import-v10.yml'

permissions:
  contents: write

jobs:
  import-vocab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-100-prototype

      - name: Merge 1000-word source into vocab bank
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('english-100')
          bank_path=root/'vocab-bank.json'
          source_path=root/'v10-source.tsv'
          bank=json.loads(bank_path.read_text(encoding='utf-8'))
          words=bank['words'] if isinstance(bank,dict) else bank
          previous_total=len(words)

          merged={str(item['word']).strip().lower(): {'word':str(item['word']).strip().lower(),'answers':list(dict.fromkeys(item.get('answers',[])))} for item in words}
          source_entries=0
          new_words=0
          new_translations=0

          for raw in source_path.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              word, raw_answers = raw.split('\t',1)
              word=word.strip().lower()
              answers=[a.strip() for a in raw_answers.split('|') if a.strip()]
              source_entries += 1
              if word in merged:
                  current=merged[word]['answers']
                  for answer in answers:
                      if answer not in current:
                          current.append(answer)
                          new_translations += 1
              else:
                  merged[word]={'word':word,'answers':list(dict.fromkeys(answers))}
                  new_words += 1

          final_words=sorted(merged.values(), key=lambda x:x['word'])
          out={'version':10,'count':len(final_words),'words':final_words}
          bank_path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          report={
              'version':10,
              'sourceEntries':source_entries,
              'previousTotal':previous_total,
              'newWordsAdded':new_words,
              'newTranslationsAddedToExistingWords':new_translations,
              'total':len(final_words)
          }
          (root/'v10-import-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=root/'index.html'
          text=p.read_text(encoding='utf-8').replace('>V9<','>V10<')
          p.write_text(text,encoding='utf-8')

          p=root/'vocabulary.html'
          text=p.read_text(encoding='utf-8').replace('>V9<','>V10<').replace('?v=9','?v=10')
          p.write_text(text,encoding='utf-8')

          p=root/'vocabulary-v2.js'
          text=p.read_text(encoding='utf-8').replace('V9','V10')
          p.write_text(text,encoding='utf-8')

          p=root/'v2-bank.js'
          text=p.read_text(encoding='utf-8').replace("vocab-bank.json?v=7","vocab-bank.json?v=10")
          p.write_text(text,encoding='utf-8')

          print(json.dumps(report,ensure_ascii=False))
          PY

      - name: Commit V10
        run: |
          git config user.name "english-100-bot"
          git config user.email "actions@users.noreply.github.com"
          git add english-100/vocab-bank.json english-100/v10-import-report.json english-100/index.html english-100/vocabulary.html english-100/vocabulary-v2.js english-100/v2-bank.js
          git commit -m "V10: import pasted 1000-word vocabulary list"
          git push origin english-100-prototype
