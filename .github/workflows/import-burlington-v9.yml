name: Import Burlington Vocabulary V9

on:
  push:
    branches: [english-100-prototype]

permissions:
  contents: write

jobs:
  import-vocabulary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-100-prototype

      - name: Merge Burlington vocabulary into central bank
        run: |
          node <<'NODE'
          const fs=require('fs');
          const bankPath='english-100/vocab-bank.json';
          const sourcePath='english-100/burlington-v9-source.tsv';
          const bank=JSON.parse(fs.readFileSync(bankPath,'utf8'));
          const lines=fs.readFileSync(sourcePath,'utf8').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
          const source=[];
          for(const line of lines){
            const tab=line.indexOf('\t');
            if(tab<1) throw new Error(`Bad source line: ${line}`);
            const word=line.slice(0,tab).trim().toLowerCase();
            const answers=line.slice(tab+1).split('||').map(x=>x.trim()).filter(Boolean);
            source.push({word,answers});
          }
          const merged=new Map(bank.words.map(item=>[item.word.toLowerCase(),{word:item.word.toLowerCase(),answers:[...item.answers]}]));
          let added=0,answersAdded=0;
          for(const item of source){
            if(!merged.has(item.word)){
              merged.set(item.word,{word:item.word,answers:[...new Set(item.answers)]});
              added++;
            } else {
              const existing=merged.get(item.word);
              for(const answer of item.answers){
                if(!existing.answers.includes(answer)){
                  existing.answers.push(answer);
                  answersAdded++;
                }
              }
            }
          }
          const words=[...merged.values()].sort((a,b)=>a.word.localeCompare(b,'en'));
          const next={version:9,count:words.length,words};
          fs.writeFileSync(bankPath,JSON.stringify(next,null,2)+'\n');
          fs.writeFileSync('english-100/v9-import-report.json',JSON.stringify({version:9,sourceEntries:source.length,previousTotal:bank.words.length,newWordsAdded:added,newTranslationsAddedToExistingWords:answersAdded,total:words.length},null,2)+'\n');

          const replace=(path,replacements)=>{
            let text=fs.readFileSync(path,'utf8');
            for(const [from,to] of replacements) text=text.split(from).join(to);
            fs.writeFileSync(path,text);
          };
          replace('english-100/index.html',[['V8','V9']]);
          replace('english-100/vocabulary.html',[['V8','V9'],['?v=8','?v=9']]);
          replace('english-100/vocabulary-v2.js',[['V8','V9']]);
          console.log({sourceEntries:source.length,previousTotal:bank.words.length,newWordsAdded:added,newTranslationsAddedToExistingWords:answersAdded,total:words.length});
          NODE

      - name: Commit V9 import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-100/vocab-bank.json english-100/v9-import-report.json english-100/index.html english-100/vocabulary.html english-100/vocabulary-v2.js
          git commit -m "V9 import Burlington vocabulary" || exit 0
          git push origin english-100-prototype
