name: Add Piano V8

on:
  push:
    branches: [english-100-prototype]
    paths:
      - '.github/workflows/add-piano-v8.yml'

permissions:
  contents: write

jobs:
  update-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-100-prototype
      - name: Add piano and bump V8
        run: |
          node <<'NODE'
          const fs = require('fs');

          const bankPath = 'english-100/vocab-bank.json';
          const data = JSON.parse(fs.readFileSync(bankPath, 'utf8'));
          if (!data.words.some(item => item.word === 'piano')) {
            data.words.push({ word: 'piano', answers: ['פסנתר'] });
          }
          data.words.sort((a,b) => a.word < b.word ? -1 : a.word > b.word ? 1 : 0);
          data.version = 8;
          data.count = data.words.length;
          fs.writeFileSync(bankPath, JSON.stringify(data, null, 2) + '\n');

          for (const path of ['english-100/vocabulary.html','english-100/index.html','english-100/vocabulary-v2.js']) {
            let text = fs.readFileSync(path, 'utf8');
            text = text.replaceAll('V7', 'V8').replaceAll('?v=7', '?v=8');
            fs.writeFileSync(path, text);
          }
          NODE
      - name: Commit V8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-100/vocab-bank.json english-100/vocabulary.html english-100/index.html english-100/vocabulary-v2.js
          git diff --cached --quiet || git commit -m "V8: add piano to vocabulary bank"
          git push